<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">SLAM — Műsor</title>
  <link rel="shortcut icon" href="img/ooslam-removebg-preview.png">
  <link rel="stylesheet" href="theme.css">
  <link href="_app/immutable/assets/0.b9ef364e.css" rel="stylesheet">
  <link rel="stylesheet" href="_app/immutable/assets/slamcss-all.css">
  <script src="_app/immutable/entry/slam-all.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

    :root {
      --green:       #27dc54;
      --green-2:     #11e281;
      --sched-live-1: #0c7a33;
      --sched-live-2: #1fae55;
      --sched-blue:  #0a3fc4;
      --sched-blue-2: #1568f5;
      --sched-blue-3: #2f8bff;
      --text:        #ffffff;
      --muted:       rgba(255,255,255,.6);
      --border:      rgba(255,255,255,.1);
      --font:        var(--font-primary, lato, sans-serif);
      --header-h:    7.2rem;
    }

    body {
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding-top: var(--header-h);
    }

    .musor-page {
      max-width: 76rem;
      margin: 0 auto;
      padding: 2.4rem 2rem 10rem;
    }

    /* ── vissza a műsorrendhez ── */
    .musor-back {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font: 700 1.3rem/1 var(--font);
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color .2s ease;
    }
    .musor-back:hover { color: #fff; }
    .musor-back svg { width: 1.6rem; height: 1.6rem; }

    /* ── fejléc kártya, ugyanaz a formanyelv, mint a műsorrend sorai ── */
    .musor-hero {
      position: relative;
      padding: 3rem 2.4rem;
      border-radius: 1.8rem;
      background: linear-gradient(120deg, var(--sched-blue) 55%, var(--green-2) 145%);
      box-shadow: 0 20px 40px -20px rgba(2,64,200,.7);
      overflow: hidden;
    }

    .musor-hero.live {
      background: linear-gradient(135deg, var(--sched-live-1) 0%, var(--sched-live-2) 55%, var(--green) 100%);
      box-shadow: 0 20px 40px -20px rgba(12,122,51,.7);
    }

    .musor-hero-thumb {
      position: absolute;
      top: 0; bottom: 0; right: 1.5rem;
      width: auto;
      opacity: .9;
      pointer-events: none;
    }
    .musor-hero-thumb img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .musor-badge-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.6rem;
    }

    .musor-live-pill {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font: 800 1.1rem/1 var(--font);
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0,0,0,.35);
      padding: .6rem 1.2rem;
      border-radius: 100rem;
    }
    .musor-live-pill .dot {
      width: .6rem; height: .6rem;
      border-radius: 50%;
      background: #fff;
      animation: musor-blink 1.6s ease-in-out infinite;
    }
    @keyframes musor-blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    .musor-genre {
      font: 700 1.05rem/1 var(--font);
      letter-spacing: .03em;
      text-transform: uppercase;
      color: rgba(255,255,255,.75);
    }

    .musor-name {
      font: 900 clamp(2.6rem, 5vw, 4rem)/1.1 'Inter', var(--font);
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,.25);
      margin: 0 0 1rem;
      max-width: 70%;
    }

    .musor-dj-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .musor-dj-photo {
      width: 4rem; height: 4rem;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .musor-dj-photo img { width: 100%; height: 100%; object-fit: cover; }
    .musor-dj-name {
      font: 700 1.4rem/1.2 var(--font);
      color: #fff;
    }

    /* ── leírás ── */
    .musor-desc {
      margin-top: 2.4rem;
      font: 400 1.5rem/1.6 var(--font);
      color: rgba(255,255,255,.85);
      max-width: 60rem;
    }

    /* ── heti adásidők ── */
    .musor-week-title {
      margin: 3rem 0 1.2rem;
      font: 800 1.3rem/1 var(--font);
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .musor-week-list {
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }
    .musor-week-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.6rem;
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      background: rgba(255,255,255,.035);
    }
    .musor-week-day {
      font: 700 1.3rem/1 var(--font);
      color: #fff;
    }
    .musor-week-time {
      font: 400 1.3rem/1 var(--font);
      color: var(--muted);
    }

    /* ── "nem található" állapot ── */
    .musor-empty {
      text-align: center;
      padding: 6rem 2rem;
    }
    .musor-empty h1 {
      font: 900 2rem/1.2 'Inter', var(--font);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .musor-empty p {
      color: var(--muted);
      font: 400 1.4rem/1.6 var(--font);
      margin-bottom: 2rem;
    }
    .musor-empty a {
      display: inline-block;
      font: 700 1.3rem/1 var(--font);
      color: #fff;
      background: linear-gradient(120deg, var(--sched-blue), var(--green-2));
      padding: 1.2rem 2.2rem;
      border-radius: 100rem;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .musor-name { max-width: 100%; }
      .musor-hero-thumb { display: none; }
    }
  </style>
</head>
<body>

<script src="slam-depth-background.js"></script>
<script src="slam-modern-nav.js"></script>

<div class="musor-page" id="musor-page"></div>

<script src="slam-reorder.js"></script>
<script src="slam-footer-reimagined.js"></script>

<script src="schedule-data.js"></script>
<script>
function slugify(str){
  return (str||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

function toMins(t){ var p=t.split(':').map(Number); return p[0]*60+p[1]; }
function nowMins(){ var n=new Date(); return n.getHours()*60+n.getMinutes(); }

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function isLiveNow(entry, dayIdx){
  var jsDay = new Date().getDay();
  var todayIdx = jsDay === 0 ? 6 : jsDay - 1;
  if (dayIdx !== todayIdx) return false;
  var now = nowMins(), start = toMins(entry.time), end = toMins(entry.end);
  if (end < start) end += 1440;
  return now >= start && now < end;
}

(function render(){
  var slug = getParam('nev');
  var root = document.getElementById('musor-page');

  var matches = []; // { day, entry }
  if (slug) {
    Object.keys(SHOWS).forEach(function(dayIdx){
      (SHOWS[dayIdx] || []).forEach(function(entry){
        if (slugify(entry.name) === slug) {
          matches.push({ day: Number(dayIdx), entry: entry });
        }
      });
    });
  }

  if (!matches.length) {
    root.innerHTML =
      '<div class="musor-empty">' +
        '<h1>Ez a műsor nem található</h1>' +
        '<p>Lehet, hogy megváltozott a műsorrend, vagy a link elavult.</p>' +
        '<a href="musorrend.html">Vissza a műsorrendhez</a>' +
      '</div>';
    return;
  }

  // a legrészletesebb (leghosszabb leírású) találatot vesszük fő adatnak
  var main = matches.reduce(function(best, m){
    return (m.entry.desc || '').length > (best.entry.desc || '').length ? m : best;
  }, matches[0]);

  var hasRealDj = main.entry.dj && main.entry.dj !== '.';
  var djPhoto = hasRealDj ? DJ_PHOTOS[main.entry.dj] : (DJ_PHOTOS[main.entry.name] || null);
  var live = matches.some(function(m){ return isLiveNow(m.entry, m.day); });

  document.getElementById('page-title').textContent = 'SLAM — ' + main.entry.name;

  var weekRows = matches
    .sort(function(a,b){ return a.day - b.day; })
    .map(function(m){
      return '<div class="musor-week-row">' +
        '<span class="musor-week-day">' + DAYS_FULL[m.day] + '</span>' +
        '<span class="musor-week-time">' + m.entry.time + ' – ' + m.entry.end + '</span>' +
      '</div>';
    }).join('');

  root.innerHTML =
    '<a class="musor-back" href="musorrend.html">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
      'Vissza a műsorrendhez' +
    '</a>' +
    '<div class="musor-hero' + (live ? ' live' : '') + '">' +
      (djPhoto ? '<div class="musor-hero-thumb"><img src="' + djPhoto + '" alt=""></div>' : '') +
      '<div class="musor-badge-row">' +
        (live ? '<span class="musor-live-pill"><span class="dot"></span>Élőben</span>' : '') +
        '<span class="musor-genre">' + (main.entry.genre || '') + '</span>' +
      '</div>' +
      '<h1 class="musor-name">' + main.entry.name + '</h1>' +
      (hasRealDj ? '<div class="musor-dj-row">' +
        (DJ_PHOTOS[main.entry.dj] ? '<span class="musor-dj-photo"><img src="' + DJ_PHOTOS[main.entry.dj] + '" alt=""></span>' : '') +
        '<span class="musor-dj-name">' + main.entry.dj + '</span>' +
      '</div>' : '') +
    '</div>' +
    (main.entry.desc ? '<p class="musor-desc">' + main.entry.desc + '</p>' : '') +
    '<div class="musor-week-title">Adásidők ezen a héten</div>' +
    '<div class="musor-week-list">' + weekRows + '</div>';
})();
</script>

</body>
</html>
