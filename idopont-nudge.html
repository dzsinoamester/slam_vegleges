* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 20px; font-family: -apple-system, sans-serif;
  background: #0a1a3a; color: #fff; min-height: 100vh;
}
h1 { font-size: 18px; margin: 0 0 24px; font-weight: 600; }
.stage {
  background: linear-gradient(160deg, #0af0a0 0%, #0260F0 60%, #0a1a3a 100%);
  border-radius: 16px; padding: 40px 24px; margin-bottom: 24px;
  display: flex; justify-content: center;
}
.pill-wrap { position: relative; }
.slam-prog-card2-time {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(4,40,110,.85);
  color: #fff;
  font: 400 32px/1 agootack, sans-serif;
  padding: 14px 27px;
  border-radius: 100px; white-space: nowrap; text-align: center;
  box-shadow: 0 2px 6px rgba(255,255,255,.35);
  outline: 1px dashed rgba(255,255,255,.4);
  outline-offset: -1px;
}
.slam-prog-card2-time .t {
  display: inline-block;
  outline: 1px dashed rgba(255,80,80,.6);
}
.controls {
  background: rgba(255,255,255,.06); border-radius: 12px; padding: 20px;
}
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.row label { width: 90px; font-size: 14px; opacity: .85; }
.row input[type=range] { flex: 1; }
.row .val { width: 60px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.output {
  margin-top: 20px; padding: 14px 16px; background: #041a4a; border-radius: 8px;
  font-family: "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-all;
}
.hint { font-size: 12px; opacity: .6; margin-top: 8px; }
.status { font-size: 12px; margin-bottom: 16px; padding: 8px 12px; border-radius: 6px; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
<h1>Időpont pill — szöveg finomhangolása (agootack font)</h1>
<div class="status" id="status">Font betöltése...</div>

<div class="stage">
  <div class="pill-wrap">
    <span class="slam-prog-card2-time"><span class="t" id="txt">00:00 - 07:00</span></span>
  </div>
</div>

<div class="controls">
  <div class="row">
    <label>X eltolás</label>
    <input type="range" id="x" min="-15" max="15" step="0.5" value="0">
    <span class="val" id="xval">0px</span>
  </div>
  <div class="row">
    <label>Y eltolás</label>
    <input type="range" id="y" min="-15" max="15" step="0.5" value="0">
    <span class="val" id="yval">0px</span>
  </div>
  <div class="output" id="out">transform: translate(0px, 0px);</div>
  <div class="hint">Húzd a csúszkákat, amíg a piros szaggatott keretes szöveg pixelre középen nem ül a fehér szaggatott kereten (a pill belsején) belül.</div>
</div>

<script>
var txt = document.getElementById("txt");
var xEl = document.getElementById("x");
var yEl = document.getElementById("y");
var xval = document.getElementById("xval");
var yval = document.getElementById("yval");
var out = document.getElementById("out");

function update() {
  var xv = parseFloat(xEl.value);
  var yv = parseFloat(yEl.value);
  txt.style.transform = "translate(" + xv + "px, " + yv + "px)";
  xval.textContent = xv + "px";
  yval.textContent = yv + "px";
  out.textContent = ".slam-prog-card2-time .t {" + String.fromCharCode(10) + "  transform: translate(" + xv + "px, " + yv + "px);" + String.fromCharCode(10) + "}";
}
xEl.addEventListener("input", update);
yEl.addEventListener("input", update);
update();

if (document.fonts) {
  document.fonts.load('32px agootack').then(function() {
    return document.fonts.ready;
  }).then(function() {
    var loaded = false;
    document.fonts.forEach(function(f) {
      if (f.family.indexOf('agootack') !== -1 && f.status === 'loaded') loaded = true;
    });
    document.getElementById('status').textContent = loaded ? 'Font betöltve ✓' : 'Font nem töltött be — fallback fontot látsz';
    document.getElementById('status').style.background = loaded ? 'rgba(40,200,120,.25)' : 'rgba(220,60,60,.25)';
  }).catch(function(e) {
    document.getElementById('status').textContent = 'Hiba a font betöltésekor: ' + e;
  });
} else {
  document.getElementById('status').textContent = 'A böngésző nem támogatja a document.fonts API-t';
}
</script>
</body>
</html>
